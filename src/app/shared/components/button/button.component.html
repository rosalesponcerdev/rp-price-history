<button
  class="w-full px-3 py-2 not-disabled:cursor-pointer font-semibold hover:not-disabled:opacity-90 focus-visible:outline-2 focus-visible:outline-offset-2 disabled:opacity-70"
  [ngClass]="classNameObject()"
  [disabled]="disableButton()"
  [type]="type()"
  (click)="clicked.emit()">
  @if (loading()) {
    <div class="loader m-auto"></div>
  } @else {
    <ng-content />
  }
</button>
