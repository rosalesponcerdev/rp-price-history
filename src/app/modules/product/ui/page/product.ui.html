<h1>{{product()?.id}}</h1>
<h2>{{product()?.name}}</h2>
<h3>{{product()?.description}}</h3>
<h3>{{product()?.category?.name}}</h3>

<section class="mt-5">
  <rp-button className="bg-green-500" (clicked)="clickHandler()">
    Agregar presentación
  </rp-button>

  <h3 class="my-4 text-center text-2xl font-semibold">Presentaciones</h3>

  <ul>
    @for (presentation of presentations(); track presentation.id) {
    <li class="my-4 py-2">
      <a
        class="font-bold cursor-pointer hover:text-red-600"
        [routerLink]="[`/presentation/${presentation.id}`]">
        {{presentation.presentationName}}
      </a>
    </li>
    }
  </ul>
</section>
